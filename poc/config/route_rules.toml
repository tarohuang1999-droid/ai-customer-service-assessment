# 分流與優先級規則（定義來源：../taxonomy-and-priority-spec.md 第 3、4 節）
# 優先級：P4 最高、P1 最低

confidence_threshold = 0.70     # 細項分類信心低於此值 -> human
level_conf_threshold = 0.70     # 急迫度／影響程度信心低於此值 -> 視為 low
high_amount_threshold = 30000   # 高額金錢規則
urgent_window_hours = 72        # 72 小時內出發或使用
max_body_chars = 300            # 送入模型的內文長度上限（保留開頭與結尾）
fixed_p1_categories = ["other"] # 固定為 P1 的大類

# 急迫度 x 影響程度 -> 優先級
[priority_matrix.high]
high = "P4"
medium = "P4"
low = "P4"

[priority_matrix.medium]
high = "P3"
medium = "P2"
low = "P2"

[priority_matrix.low]
high = "P3"
medium = "P2"
low = "P2"

# 硬性規則：命中即 route = human，優先級至少調升到 min_priority
[rules.urgent_72h]
label = "72 小時內出發或使用"
min_priority = "P4"

[rules.high_amount]
label = "金額超過 30,000 元"
min_priority = "P3"

[rules.escalation]
label = "客訴升級字眼"
min_priority = "P3"

[rules.repeat_followup]
label = "重複催單"
min_priority = "P3"
