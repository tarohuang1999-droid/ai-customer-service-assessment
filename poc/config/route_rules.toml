# 分流與優先級判定規則（Priority: P1=低優先 -> P2=一般標準 -> P3=高影響爭議 -> P4=超重要急件）
confidence_threshold = 0.70
urgency_conf_threshold = 0.70
impact_conf_threshold = 0.70
high_amount_threshold = 30000
max_body_chars = 300

[priority_rules]
# P1 (Low): 非客服類別（other_non_cs：廣告、測試單、商務/媒體/人資轉介）
p1_categories = ["other_non_cs"]

# P2 (Standard): 一般售前諮詢、訂單與規定查詢、一般退改、純抱怨、待補件（預設）
# P3 (High Impact): 高額退改求償 (>30,000)、升級字眼、重複催單、實質客訴爭議（service_or_billing_dispute）、或模型 impact_level=high
p3_sub_categories = ["service_or_billing_dispute"]

# P4 (Critical): 72小時內急件、旅途中危機、帳號鎖定待付款（由 regex urgent_72h 或模型 urgent_level=high 觸發）
