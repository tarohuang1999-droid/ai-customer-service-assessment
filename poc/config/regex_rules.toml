# Regex 與前處理訊號規則定義
min_body_chars = 6
anonymous_names = ["佚名", "test", "測試", ""]

[patterns]
order_id = 'LT\d{8,}'
amount_yuan = '(\d{1,3}(?:,\d{3})+|\d+)\s*元'
amount_wan = '(\d+(?:\.\d+)?)\s*萬'
amount_comma = '\b(\d{2,3},\d{3})\b'

spam = '博弈|體驗金|儲值再送|加賴好友'
test_ticket = '^測試$'

# 72小時內出發／使用、旅途中緊急異常、帳號鎖定含待付款訂單
urgent_72h = '(明天|明日|今天).*(出發|使用|要用|進不了場|颱風)|房間.*蟑螂|不敢住了|帳號被鎖.*待付款'

# 客訴升級與爭議字眼（排除記者正常採訪邀約）
escalation = '消保官|新聞媒體|媒體爆料|聯絡.*媒體|社團公開|律師|爭議款|銀行止付|直接請銀行止付'
media_interview_exclude = '媒體採訪|採訪詢問|專題.*受訪'

# 重複催單字眼
repeat_cue = '再次詢問|到底處理了沒|前天反映|三天前反映'

# 外部最新法規／簽證變動（知識庫無唯一有效依據，需轉人工確認）
external_policy_change = '(簽證|落地簽|法規).*(最近有變|新規定)'

# 內文高敏個資（身分證、手機、銀行帳號，加 word boundary 避免誤抓 LT 訂單號）
inline_pii = '\b[A-Z][12]\d{8}\b|\b09\d{8}\b|\b\d{3}-\d{10,14}\b'

# 涉及退改、扣款或求償語境（搭配金額 > 30,000 判斷）
financial_context = '退費|退款|取消|賠償|求償|扣款|止付'
