# 確定性訊號規則（只寫通用字詞，不得針對個別樣本）

min_body_chars_for_model = 1
anonymous_names = ["佚名", "匿名", "test", "測試", ""]
context_window_chars = 15   # 日期與出發／使用語境的最大距離

[patterns]
order_id = 'LT\d{8,}'

# 無關信件（規則歸檔，不呼叫模型）
spam = '博弈|體驗金|儲值再送|加賴|加\s*LINE|中獎|免費領取|貸款'
test_ticket = '^(測試|test|TEST)$'
auto_reply = '自動回覆|Automatic reply|Auto-Reply|Out of Office|休假中|無法投遞|Undeliverable'

# 金錢語境（搭配金額門檻）
financial_context = '退費|退款|取消|賠償|求償|扣款|止付|損失|退還|多收'

# 客訴升級字眼；排除媒體採訪邀約
escalation = '消保官|消基會|消費者保護|律師|提告|法律途徑|媒體|爆料|公開|負評|爭議款|止付'
media_interview_exclude = '採訪|受訪|專題|發言人'

# 重複催單字眼
repeat_cue = '再次詢問|再次反映|第二次|又來信|還沒(有)?回|沒(有)?人回|仍未(回|處理)|至今(沒有|未)'

# 出發或使用語境（搭配日期判斷 72 小時）
departure_context = '出發|使用|入住|搭乘|登機|進場|啟程|要用|要去'

# 內文個資（只標記，不影響 route）
inline_pii = '\b[A-Z][12]\d{8}\b|\b09\d{8}\b|\b\d{3}-\d{10,14}\b'
