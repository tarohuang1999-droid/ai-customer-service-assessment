# 分流設定（定義來源：../category-spec.md 第 2–4 節）

mode = "rule"                    # rule：條件規則（預設）；risk：風險分數。可用 --routing-mode 覆寫
classification_threshold = 0.50  # 細項分類信心低於此值 -> other/unclear（human）
level_conf_threshold = 0.70      # 排序時，急迫度、影響程度的信心低於此值視為 low
max_body_chars = 300             # 送入模型的內文長度上限（保留開頭 65% 與結尾 35%）

# ── mode = "rule"：條件規則 ─────────────────────────────────────────
# 只有列在這裡的細項，且急迫度、影響程度都在允許清單內，才是 auto；其餘一律 human。
[rule.auto]
"product/product_info"        = { urgency = ["low", "medium"], impact = ["low", "medium"] }
"product/travel_rule"         = { urgency = ["low", "medium"], impact = ["low", "medium"] }
"product/cancel_policy"       = { urgency = ["low", "medium"], impact = ["low", "medium"] }
"order_inquiry/order_status"  = { urgency = ["low", "medium"], impact = ["low", "medium"] }
"order_inquiry/refund_status" = { urgency = ["low", "medium"], impact = ["low", "medium"] }
"order_inquiry/document"      = { urgency = ["low", "medium"], impact = ["low", "medium"] }
"order_inquiry/member_points" = { urgency = ["low", "medium"], impact = ["low", "medium"] }
"complaint/service_complaint" = { urgency = ["low", "medium"], impact = ["low", "medium"] }
"other/business"              = { urgency = ["low", "medium"], impact = ["low", "medium"] }
"other/irrelevant"            = { urgency = ["low", "medium"], impact = ["low", "medium"] }
"unclear/insufficient_info"   = { urgency = ["low", "medium"], impact = ["low", "medium"] }

# ── mode = "risk"：風險分數（比較用）────────────────────────────────
# 細項先依 [route] 取得預設 route；風險分數 ≥ threshold 時改為 human。
# 風險分數 = w_c × (1 − 分類信心) + w_u × 急迫度選 high 的信心 + w_i × 影響程度選 high 的信心
[risk]
w_c = 1.0
w_u = 1.0
w_i = 1.0
threshold = 0.6

[route]
"product/product_info" = "auto"
"product/travel_rule" = "auto"
"product/cancel_policy" = "auto"
"product/custom_request" = "human"
"order_inquiry/order_status" = "auto"
"order_inquiry/refund_status" = "auto"
"order_inquiry/document" = "auto"
"order_inquiry/member_points" = "auto"
"order_change/booking_change" = "human"
"order_change/data_correction" = "human"
"system_issue/account_access" = "human"
"system_issue/checkout_error" = "human"
"trip_incident/disruption" = "human"
"complaint/service_complaint" = "auto"
"complaint/compensation_claim" = "human"
"other/business" = "auto"
"other/irrelevant" = "auto"
"other/unclear" = "human"
"unclear/insufficient_info" = "auto"
