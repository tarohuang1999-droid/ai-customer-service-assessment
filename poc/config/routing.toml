# 分流與優先級對應表（定義來源：../category-priority-spec.md 第 2–4 節）
# 優先級：P4 最高、P1 最低

confidence_threshold = 0.70   # 細項分類信心低於此值 -> human
max_body_chars = 300          # 送入模型的內文長度上限（保留開頭 65% 與結尾 35%）

# 細項 -> route
[route]
"product/product_info" = "auto"
"product/travel_rule" = "auto"
"product/cancel_policy" = "auto"
"product/custom_request" = "human"
"order_inquiry/order_status" = "auto"
"order_inquiry/refund_status" = "auto"
"order_inquiry/document" = "auto"
"order_inquiry/member_points" = "auto"
"order_change/booking_change" = "human"
"order_change/data_correction" = "human"
"system_issue/account_access" = "human"
"system_issue/checkout_error" = "human"
"trip_incident/disruption" = "human"
"complaint/service_complaint" = "human"
"complaint/compensation_claim" = "human"
"other/business" = "human"
"other/irrelevant" = "auto"
"unclear/insufficient_info" = "auto"

# 急迫度 x 影響程度 -> 優先級
[priority_matrix.high]
high = "P4"
medium = "P4"
low = "P4"

[priority_matrix.medium]
high = "P3"
medium = "P2"
low = "P2"

[priority_matrix.low]
high = "P3"
medium = "P2"
low = "P2"

# 細項的優先級下限：取對應表結果與下限的較高者
[priority_floor]
"trip_incident/disruption" = "P4"
"complaint/compensation_claim" = "P3"

# 大類固定優先級（覆蓋上述結果）
[priority_fixed]
other = "P1"
