# 分流設定（定義來源：../category-spec.md 第 2–4 節）

classification_threshold = 0.50  # 細項分類信心低於此值 -> other/unclear（human）
level_conf_threshold = 0.70      # 排序時，急迫度、影響程度的信心低於此值視為 low
max_body_chars = 1000             # 送入模型的內文長度上限（保留開頭 65% 與結尾 35%）

# 條件規則：auto 白名單
# 只有列在這裡的細項，且急迫度、影響程度都在允許清單內，才是 auto；其餘一律 human。
# 白名單外的細項（custom_request、booking_change、data_correction、account_access、
# checkout_error、disruption、compensation_claim、other/unclear）一律 human。
[auto]
"product/product_info"        = { urgency = ["low", "medium"], impact = ["low", "medium"] }
"product/travel_rule"         = { urgency = ["low", "medium"], impact = ["low", "medium"] }
"product/cancel_policy"       = { urgency = ["low", "medium"], impact = ["low", "medium"] }
"order_inquiry/order_status"  = { urgency = ["low", "medium"], impact = ["low", "medium"] }
"order_inquiry/refund_status" = { urgency = ["low", "medium"], impact = ["low", "medium"] }
"order_inquiry/document"      = { urgency = ["low", "medium"], impact = ["low", "medium"] }
"order_inquiry/member_points" = { urgency = ["low", "medium"], impact = ["low", "medium"] }
"complaint/service_complaint" = { urgency = ["low", "medium"], impact = ["low", "medium"] }
"other/business"              = { urgency = ["low", "medium"], impact = ["low", "medium"] }
# 廣告、測試單、自動回覆：客服不處理，不論程度一律歸檔
"other/irrelevant"            = { urgency = ["low", "medium", "high"], impact = ["low", "medium", "high"] }

# 判斷原因：router 依判斷結果帶入對應的 reason_code 與說明，輸出到 triage_result.csv 與 log。
# 說明可直接修改，不需要改程式；{key}、{urgency}、{impact} 會代入實際值。
[reasons]
auto_ok          = "符合 auto 條件"
not_in_whitelist = "{key} 需要人處理（不在 auto 白名單）"
urgency_high     = "急迫度 {urgency}，需要人處理"
impact_high      = "影響程度 {impact}，需要人處理"
low_confidence   = "低於門檻，歸為 other/unclear（模型原判 {key}）"
model_error      = "模型異常轉人工"

