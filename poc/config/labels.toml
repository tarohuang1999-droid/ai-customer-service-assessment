# 決策模型 3 階段選擇題設定檔（每次呼叫選項皆 < 20 個）
# Stage 1 (stage=classification): 合併 category/sub_category 直接選出分類（14 個模型選項 + 2 個規則前置攔截項）
# Stage 2 (stage=urgent_level): 時間緊迫程度選擇題（high / medium / low）
# Stage 3 (stage=impact_level): 業務與財務影響程度選擇題（high / medium / low）

[classification]
instructions = "根據客服工單的主旨與內文，選出最符合的『主類別/細項分類（category/sub_category）』"

# 1. product_inquiry（售前產品詢問）
[classification.options."product_inquiry/product_spec_and_price"]
route = "auto"
description = "【售前產品詢問—規格與費用】尚未下單或詢問產品內容：團費包含項目（小費/稅金）、2歲兒童收費方式、JR PASS票券兌換地點與是否需帶護照正本、購買前詢問冬季合掌村大雪停駛是否取消與退費通則"

[classification.options."product_inquiry/policy_and_regulation"]
route = "auto"
description = "【售前產品詢問—旅遊法規與簽證】詢問出國入境護照效期不足六個月規定、泰國落地簽或最新簽證規定、旅遊保險通則"

[classification.options."product_inquiry/customization_request"]
route = "human"
description = "【售前產品詢問—特殊客製化需求】需人工向供應商確認之特殊安排：全素食機上餐與團體餐、長輩輪椅無障礙房與斜坡巴士、郵輪指定高樓層或船中段艙房"

# 2. order_info（訂單與規定查詢）
[classification.options."order_info/order_status_and_points"]
route = "auto"
description = "【訂單與規定查詢—訂單狀態與點數】已下單查詢進度或會員點數：詢問行程表或行前出發通知何時寄出、詢問會員旺來金點數折抵上限與過期規則"

[classification.options."order_info/order_policy_and_refund_status"]
route = "auto"
description = "【訂單與規定查詢—退改規定與退款進度】僅查詢規定或查帳（未要求執行退改）：詢問出發前3天取消手續費比例與定型化契約級距、查詢已辦理之信用卡退款還需幾個工作天入帳"

[classification.options."order_info/document_and_invoice"]
route = "auto"
description = "【訂單與規定查詢—憑證與發票收據】索取訂單憑證或修改發票：刷卡後未收到確認信、未收到電子門票QR code、發票統編打錯申請重開、二聯式改開三聯式發票、開立英文收據invoice"

[classification.options."order_info/account_and_pricing_issue"]
route = "human"
description = "【訂單與規定查詢—帳號登入與結帳價差】系統帳號或結帳金額異常：會員帳號被鎖且收不到驗證碼（含待付款訂單）、官網標價與結帳金額不同（如21900變25400）"

# 3. order_change（訂單修改與加購）
[classification.options."order_change/schedule_or_group_change"]
route = "human"
description = "【訂單修改與加購—改期與團體異動】針對已成立訂單申請變更行程：申請改期到其他月份梯次並問差價、英文或中文申請更改一日遊接送飯店pickup hotel、團體12人中有2人退出詢問團費變動"

[classification.options."order_change/passenger_or_addon_change"]
route = "human"
description = "【訂單修改與加購—旅客資料與加購】針對已成立訂單修改名單或加購：更正旅客護照英文姓名拼音錯誤、已訂訂單申請加購嬰兒票、已訂廉航行程申請加購回程托運行李重量"

# 4. order_refund（訂單取消與退費）
[classification.options."order_refund/cancellation_refund_request"]
route = "human"
description = "【訂單取消與退費—申請取消行程與退費】針對已成立訂單申請取消退費：因家母住院申請取消退費、因父親車禍骨折開刀申請18.6萬全額退費、明日出發遇颱風警報詢問延期與退費"

[classification.options."order_refund/refund_payout_request"]
route = "human"
description = "【訂單取消與退費—退款匯款帳戶作業】已辦理取消之訂單提供身分證、手機與銀行帳號，要求將退款匯入指定銀行帳戶"

# 5. complaint（客訴與爭議）
[classification.options."complaint/pure_complaint"]
route = "auto"
description = "【客訴與爭議—純抱怨服務通道】純粹抱怨客服電話打不通或等40分鐘沒人接，未要求賠償或退款（或僅順帶一般行程表寄送詢問）"

[classification.options."complaint/service_or_billing_dispute"]
route = "human"
description = "【客訴與爭議—實質服務瑕疵與扣款求償】要求賠償、退款或升級申訴：投訴導遊滑手機與行程縮水求償、領隊遲到致錯過班機求償、旅途中飯店房間有蟑螂或老舊發霉、疑似重複扣款與二次催單、投訴客服報錯改期費要求退還"

# 6. other_non_cs（非客服信件）
[classification.options."other_non_cs/b2b_media_hr_referral"]
route = "human"
description = "【非客服信件—商務公關與人資轉介】非一般旅客客服之外部信件：120人企業包團員工旅遊詢價、遊覽車供應商回傳包車報價單、應徵日語導遊或OP職缺、KOL洽談旅遊業配合作、財經記者媒體採訪邀約"

[classification.options."other_non_cs/spam_or_test"]
route = "auto"
precheck_only = true
description = "【非客服信件—廣告或系統測試單】由前置規則直接攔截：外部博弈體驗金推銷廣告、內部系統測試單"

# 7. unknown（待釐清／需補件）
[classification.options."unknown/insufficient_info"]
route = "auto"
precheck_only = true
description = "【待釐清—資訊不足需補件】由前置規則直接攔截：內文極短（如僅『可以退嗎』）且缺乏訂單號與具體訴求上下文"

# Stage 2: 時間緊迫程度（urgent_level）
[urgent_level]
instructions = "評估此工單的時間緊迫程度（urgent_level）"

[urgent_level.options.high]
description = "極度緊急（對應 P4 超重要）：72小時內（含今日、明日、後天）即將出發或使用票券、旅途中突發危機（領隊遲到錯過班機、飯店房間有蟑螂）、或帳號被鎖且有待付款訂單急需處理"

[urgent_level.options.medium]
description = "近期需處理：出發日在3天至14天內的訂單改期、加購、換接送飯店或單據補正需求"

[urgent_level.options.low]
description = "一般非急件：出發日在2週以上、純售前產品與簽證詢問、一般訂單與退款進度查詢、發票統編重開、事後客訴求償或非客服外部信件"

# Stage 3: 業務與財務影響程度（impact_level）
[impact_level]
instructions = "評估此工單的業務與財務影響程度（impact_level）"

[impact_level.options.high]
description = "高影響（對應 P3 高優先）：退改或求償金額超過30,000元、疑似重複扣款或多收費用、嚴重服務瑕疵（導遊失職、行程縮水、錯過班機、房間有蟑螂）、揚言找消保官或媒體爆料、同客重複催單"

[impact_level.options.medium]
description = "中度影響：一般訂單改期、更改接送飯店、更正護照英文拼音、加購嬰兒票或行李、一般取消退費申請、帳號登入或結帳價差"

[impact_level.options.low]
description = "低影響：單純詢問產品規格與費用、護照簽證規定、查訂單或退款進度、補寄確認信與修改發票統編、純抱怨電話難打無求償、非客服外部信件"
